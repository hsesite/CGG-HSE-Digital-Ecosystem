<style>

/* ==================================================
   Splash Screen
   ================================================== */

#splash-screen{

position:fixed;
inset:0;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top,#0f3d2a 0%,#05080d 100%);

z-index:99999;

transition:opacity .45s ease, visibility .45s ease;

}

#splash-screen.fade-out{

opacity:0;
visibility:hidden;

}

.splash-logo{

width:120px;
height:120px;

object-fit:contain;

filter:drop-shadow(0 0 22px rgba(0,230,118,.35));

animation:pulse 2s infinite ease-in-out;

}

@keyframes pulse{

0%,100%{transform:scale(1);}
50%{transform:scale(1.06);}

}

.splash-title{

margin-top:20px;

font-size:24px;
font-weight:700;

color:#fff;

}

.splash-sub{

margin-top:8px;

font-size:14px;
color:#9fb7a9;

}

@media(max-width:768px){

.splash-logo{

width:92px;
height:92px;

}

.splash-title{

font-size:18px;

}

}

</style>

</head>

<body>

<!-- ==========================================
     Splash Screen
     ========================================== -->

<div id="splash-screen">

<img
src="assets/Logo/logo-cgg.png"
class="splash-logo"
alt="CGG Logo">

<div class="splash-title">

CGG HSE Digital Operating System

</div>

<div class="splash-sub">

Loading Command Center...

</div>

</div>

<!-- ==========================================
     Main App
     ========================================== -->

<div id="app">

<aside id="sidebar"></aside>

<main>

<div id="router-view"></div>

</main>

</div>

<!-- ==========================================
     JS Engine
     ========================================== -->

<script src="js/api.js"></script>

<script src="js/layout-engine.js"></script>
<script src="js/widget-engine.js"></script>
<script src="js/window-manager.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/dashboard-api.js"></script>
<script src="js/dashboard-live.js"></script>
<script src="js/dashboard.js"></script>

<script src="js/inspection.js"></script>

<script src="js/router.js"></script>
<script src="js/app.js"></script>
<script src="js/mobile-effects.js"></script>

<!-- Mobile Engine (HP Only) -->
<script src="js/mobile.js"></script>

<script>

/* ==========================================
   Splash Controller (Safe Version)
   ========================================== */

window.addEventListener("load", () => {

  setTimeout(() => {

    const splash = document.getElementById("splash-screen");

    if (splash) {
      splash.classList.add("fade-out");
    }

  }, 1200);

});

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(reg => console.log("✓ Service Worker aktif:", reg.scope))
      .catch(err => console.error("Service Worker gagal:", err));
  });
}
</script>
   <script src="js/offline/db.js"></script>
   
</body>
