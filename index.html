<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CGG HSE Digital Operating System</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/workspace.css">
<link rel="stylesheet" href="css/widgets.css">
<link rel="stylesheet" href="css/window-manager.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/animation.css">

<link rel="icon" href="assets/Logo/logo-cgg.png">

<style>

html,body{
margin:0;
padding:0;
height:100%;
background:#060b14;
overflow:hidden;
font-family:Inter,system-ui,sans-serif;
}

#app{
display:grid;
grid-template-columns:88px 1fr;
height:100vh;
}

main{
position:relative;
overflow:auto;
padding:24px;
}

#router-view{
min-height:100%;
}

#splash-screen{

position:fixed;
inset:0;

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

background:
radial-gradient(circle at top,#0f3d2a,#05080d);

z-index:99999;

transition:opacity .45s ease;

}

#splash-screen.fade-out{

opacity:0;
pointer-events:none;

}

.splash-logo-cgg.png{

width:120px;
height:120px;
object-fit:contain;

animation:pulse 1.8s infinite;

}

@keyframes pulse{

0%,100%{transform:scale(1);}
50%{transform:scale(1.06);}

}

.splash-title{

margin-top:18px;
font-size:22px;
font-weight:700;
color:white;

}

.splash-sub{

margin-top:6px;
color:#9fb7a9;
font-size:14px;

}

@media(max-width:768px){

#app{

grid-template-columns:72px 1fr;

}

main{

padding:16px;

}

.splash-logo-cgg.png{

width:92px;
height:92px;

}

.splash-title{

font-size:18px;

}

}

</style>

</head>

<body>

<div id="splash-screen">

<img src=assets/Logo/logo-cgg.png">
class="splash-logo-cgg.png"
alt="CGG">

<div class="splash-title">

CGG HSE Digital Operating System

</div>

<div class="splash-sub">

Loading Command Center...

</div>

</div>

<div id="app">

<aside id="sidebar"></aside>

<main>

<div id="router-view"></div>

</main>

</div>

<script src="js/api.js"></script>

<script src="js/layout-engine.js"></script>
<script src="js/widget-engine.js"></script>
<script src="js/window-manager.js"></script>

<script src="js/sidebar.js"></script>
<script src="js/command-center.js"></script>

<script src="js/dashboard-api.js"></script>
<script src="js/dashboard-live.js"></script>
<script src="js/dashboard.js"></script>

<script src="js/inspection.js"></script>

<script src="js/router.js"></script>
<script src="js/app.js"></script>

</body>
</html>
